<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shardkeeper</title>
<meta name="description" content="Explore Shardkeeper, a pixel adventure with a math worksheet cover. Collect three shards and defeat the Bramble King.">
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://origamipenguin.com/math">
<meta property="og:url" content="https://origamipenguin.com/math">
<meta property="og:image" content="https://origamipenguin.com/images/og-default.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a handheld-style cabinet — pixel canvas in a dark bezel, touch pad below; the disguise is a full-viewport paper page */
:root{
  --bezel:#15181d; --bezel-2:#20252c; --line:#323944;
  --ink:#eef1e6; --muted:#9aa5a0; --leaf:#7fcf5a; --gold:#f3c74a;
  --pixel:"Press Start 2P", "Courier New", monospace;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.skip-link,.site-nav{position:absolute;left:-10000px}
.skip-link:focus,.site-nav:focus-within{position:relative;left:auto}
@media(max-width:420px){.screen{padding:10px}.screen .panel{gap:8px}.screen p{font-size:12px}.screen p.dim{font-size:11px}.screen h2{font-size:15px}.seg button{padding:6px 9px;font-size:12px}.go{padding:10px 14px}}
@media(max-width:350px){.dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}.abtn{width:68px;height:68px}.pad{gap:8px}}
html,body{height:100%}
body{background:var(--bezel);color:var(--ink);font-family:var(--body);margin:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 24px}
.wrap{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--pixel);font-size:clamp(16px,3vw,22px);margin:0;color:var(--leaf);letter-spacing:.02em}
.hint{font-size:13px;color:var(--muted)}
.stage{position:relative;background:#000;border:3px solid var(--line);border-radius:10px;overflow:hidden}
#game{display:block;width:100%;aspect-ratio:256/208;image-rendering:pixelated;touch-action:none}
.screen{position:absolute;inset:0;background:rgba(8,10,12,.9);display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;overflow:auto}
.screen .panel{max-width:520px;display:flex;flex-direction:column;gap:14px;align-items:center}
.screen h2{font-family:var(--pixel);font-size:clamp(16px,3.4vw,26px);color:var(--gold);margin:0;line-height:1.4}
.screen p{margin:0;color:var(--ink);line-height:1.5;font-size:15px}
.screen p.dim{color:var(--muted);font-size:13.5px}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.seg button,.go{font:700 14px var(--body);border-radius:8px;padding:8px 14px;border:2px solid var(--line);background:var(--bezel-2);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--leaf);color:var(--leaf)}
.go{font:12px var(--pixel);background:var(--leaf);border-color:var(--leaf);color:#122010;padding:12px 18px}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pad{display:none;justify-content:space-between;align-items:center;gap:16px;user-select:none;-webkit-user-select:none}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px}
.dpad button,.abtn{border:2px solid var(--line);background:var(--bezel-2);color:var(--ink);border-radius:10px;font:16px var(--pixel);touch-action:none}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
.abtn{width:84px;height:84px;border-radius:50%;background:#3a2121;border-color:#6b3434}
@media (hover:none),(pointer:coarse){.pad{display:flex}}
.foot{color:var(--muted);font-size:12.5px;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
.foot kbd{font:700 11px var(--body);border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--ink)}

/* ---- disguise: always light paper, independent of theme ---- */
#cover{position:fixed;inset:0;z-index:50;background:#e9e9e6;color:#1d1d1d;overflow:auto;color-scheme:light;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));cursor:default}
.ws{max-width:760px;margin:0 auto;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);padding:clamp(18px,5vw,48px) clamp(16px,6vw,56px);font-family:Arial, Helvetica, sans-serif}
.ws-head{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;margin-bottom:22px}
.ws-head span{flex:1;min-width:140px;border-bottom:1px solid #222;padding-bottom:2px}
.ws h2{font-size:22px;margin:0 0 4px;font-weight:700}
.ws .sub{font-size:13.5px;color:#444;margin-bottom:22px}
.probs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:34px 18px;counter-reset:p}
.probs li{counter-increment:p;display:flex;gap:8px;font-size:17px;min-height:96px}
.probs li::before{content:counter(p) ".";font-size:13px;color:#333;padding-top:2px;min-width:22px}
.stack{display:flex;flex-direction:column;align-items:flex-end;font-family:"Courier New", monospace;font-size:19px;line-height:1.3}
.stack .b{border-bottom:2px solid #222;padding-left:6px}
.flat{font-family:"Courier New", monospace;font-size:19px;display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1;font-size:17px}
.fr span:first-child{border-bottom:2px solid #222;padding:0 3px}
.ws-foot{margin-top:30px;display:flex;justify-content:space-between;font-size:11.5px;color:#666}
.sheet{max-width:1100px;margin:0 auto;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);font-family:Arial, Helvetica, sans-serif;font-size:13px}
.sh-top{display:flex;gap:16px;padding:8px 12px;border-bottom:1px solid #d6d6d6;flex-wrap:wrap;align-items:center}
.sh-top b{font-size:15px;font-weight:600}
.sh-menu{display:flex;gap:14px;color:#333}
.sh-fx{display:flex;gap:8px;padding:5px 12px;border-bottom:1px solid #d6d6d6;color:#333;font-family:"Courier New", monospace}
.sh-fx span:first-child{color:#777;min-width:44px;border-right:1px solid #ddd}
.sh-grid{overflow-x:auto}
.sh-grid table{border-collapse:collapse;min-width:720px;width:100%}
.sh-grid th,.sh-grid td{border:1px solid #e1e1e1;padding:3px 8px;white-space:nowrap;text-align:left;font-weight:400}
.sh-grid thead th,.sh-grid tbody th{background:#f3f3f3;color:#555;text-align:center;font-size:12px}
.sh-grid td.n{text-align:right;font-variant-numeric:tabular-nums}
.sh-grid tr.h td{font-weight:700;background:#fafafa}
.sh-tabs{display:flex;gap:2px;padding:6px 12px;border-top:1px solid #d6d6d6;background:#f6f6f6;font-size:12.5px}
.sh-tabs span{padding:3px 12px;border-radius:3px}
.sh-tabs span:first-child{background:#fff;box-shadow:0 0 0 1px #d6d6d6}
@media(max-width:420px){.screen{padding:10px;align-items:flex-start}.screen .panel{gap:8px}.screen p{font-size:12px}.screen p.dim{font-size:11px}.screen h2{font-size:15px}.seg button{padding:6px 9px;font-size:12px}.go{padding:10px 14px}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to game</a>
<nav class="site-nav" aria-label="Main navigation"><a href="/">Origami Penguin</a></nav>
<main id="main" class="wrap">
  <header>
    <h1>SHARDKEEPER</h1>
    <span class="hint">Stop for half a second and the screen becomes <span id="coverName">a math worksheet</span>. Move to come back.</span>
  </header>
  <div class="stage">
    <canvas id="game" aria-label="Shardkeeper game screen"></canvas>
    <div class="screen" id="screen"></div>
  </div>
  <div class="pad" id="pad">
    <div class="dpad">
      <button class="u" data-k="up" aria-label="Up">▲</button><button class="l" data-k="left" aria-label="Left">◀</button>
      <button class="r" data-k="right" aria-label="Right">▶</button><button class="d" data-k="down" aria-label="Down">▼</button>
    </div>
    <button class="abtn" data-k="atk" aria-label="Swing sword">A</button>
  </div>
  <div class="foot">
    <span><kbd>←↑↓→</kbd> or <kbd>WASD</kbd> move · <kbd>Space</kbd> / <kbd>J</kbd> swing</span>
    <span>Find 3 shards to open the north gate.</span>
  </div>
</main>
<div id="cover" hidden></div>

<script>
(()=>{
const TW=16,COLS=16,ROWS=11,HUD=32,LW=256,FH=ROWS*TW,LH=HUD+FH,IDLE=500;
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const cv=$('#game'),ctx=cv.getContext('2d');let K=3;
function resize(){const r=cv.getBoundingClientRect();const dpr=Math.min(window.devicePixelRatio||1,2);K=Math.max(1,Math.ceil(r.width*dpr/LW));cv.width=LW*K;cv.height=LH*K;ctx.imageSmoothingEnabled=false}
window.addEventListener('resize',resize);

/* ---------- world ---------- */
const ROOMS={};
function room(key,exits,interior,opt){
  const g=[];
  for(let r=0;r<ROWS;r++){let row='';for(let c=0;c<COLS;c++){
    let ch;
    if(r===0||r===ROWS-1||c===0||c===COLS-1){
      ch='#';
      if(r===0&&c>=6&&c<=9&&exits.includes('N'))ch=opt&&opt.gate?'G':'.';
      if(r===ROWS-1&&c>=6&&c<=9&&exits.includes('S'))ch='.';
      if(c===0&&r>=4&&r<=6&&exits.includes('W'))ch='.';
      if(c===COLS-1&&r>=4&&r<=6&&exits.includes('E'))ch='.';
    }else ch=interior[r-1][c-1];
    row+=ch}g.push(row)}
  ROOMS[key]=Object.assign({key,grid:g,enemies:[],shard:null},opt||{});
}
room('1,2','NWE',['..............','..............','...,,,,,,,,...','...,......,...','...,..oo..,...','...,......,...','...,,,,,,,,...','..............','..............'],{enemies:['slime','slime']});
room('0,2','NE',['..............','..~~~~~.......','.~~~~~~~......','.~~~~~~.....o.','..~~~~........','.........o....','...o..........','..........#...','..............'],{enemies:['slime','slime','slime'],shard:[11,7]});
room('2,2','NW',['..#....#....#.','......#.......','.#.........#..','....#..#......','..............','.#....#....#..','.....#........','..#.......#...','..............'],{enemies:['bat','bat','slime','slime'],shard:[7,5]});
room('0,1','NSE',['..............','.oo......oo...','.o..........o.','..............','....,,,,,.....','..............','.o..........o.','.oo......oo...','..............'],{enemies:['bud','bud','slime']});
room('1,1','NSWE',['..............','..#........#..','..............','.....~~~~.....','.....~~~~.....','..............','..#........#..','..............','..............'],{enemies:['slime','slime','slime','bat']});
room('2,1','NSW',[',,,,,,,,,,,,,,',',,o,,,,,,,,o,,',',,,,,,,,,,,,,,',',,,,,o,,o,,,,,',',,,,,,,,,,,,,,',',,,,,o,,o,,,,,',',,,,,,,,,,,,,,',',,o,,,,,,,,o,,',',,,,,,,,,,,,,,'],{enemies:['bat','bat','bat']});
room('0,0','SE',['..............','.###....###...','.#..........#.','.#..........#.','..............','.#..........#.','.#..........#.','.###....###...','..............'],{enemies:['bud','bud','slime','slime'],shard:[7,5]});
room('1,0','NSWE',['..............','..oo......oo..','..............','......,,......','......,,......','......,,......','..............','..oo......oo..','..............'],{enemies:['slime','slime','slime','slime','bud'],gate:true});
room('2,0','SW',['..............','..~~......~~..','..~~......~~..','..............','.....####.....','..............','..~~......~~..','..~~......~~..','..............'],{enemies:['bat','bat','bat','bud']});
room('1,-1','S',['..............','.o..........o.','..............','..............','..............','..............','..............','.o..........o.','..............'],{enemies:['boss'],boss:true});

const EN={
  slime:{hp:2,spd:24,dmg:1,w:12,h:10},
  bat:{hp:1,spd:52,dmg:1,w:12,h:8,fly:true},
  bud:{hp:3,spd:10,dmg:2,w:12,h:12},
  boss:{hp:22,spd:34,dmg:2,w:30,h:26}
};

/* ---------- state ---------- */
let S=null;let state='title';let coverMode=store.get('sk-cover','worksheet');
if(!['worksheet','spreadsheet'].includes(coverMode))coverMode='worksheet';
function newGame(){
  S={time:0,endPending:null,roomKey:'1,2',p:{x:LW/2,y:FH/2+20,dir:'down',hp:6,max:6,inv:0,atk:0,kb:null,moving:false,step:0},
     gems:0,shards:[],bossDead:false,enemies:[],shots:[],drops:[],fx:[],trans:null,msg:null,visited:{'1,2':true}};
  enterRoom('1,2',true);
}
function solidAt(px,py,fly){
  const c=Math.floor(px/TW),r=Math.floor(py/TW);
  if(c<0||c>=COLS||r<0||r>=ROWS)return false;
  const t=ROOMS[S.roomKey].grid[r][c];
  if(t==='#'||t==='o')return true;
  if(t==='~')return !fly;
  if(t==='G')return S.shards.length<3;
  return false;
}
function boxFree(x,y,w,h,fly){
  return !(solidAt(x-w/2,y-h/2,fly)||solidAt(x+w/2-1,y-h/2,fly)||solidAt(x-w/2,y+h/2-1,fly)||solidAt(x+w/2-1,y+h/2-1,fly));
}
function enterRoom(key,fresh){
  S.roomKey=key;S.visited[key]=true;S.enemies=[];S.shots=[];S.drops=[];
  const R=ROOMS[key];
  if(R.shard&&!S.shards.includes(key))S.drops.push({x:R.shard[0]*TW+8,y:R.shard[1]*TW+8,kind:'shard',t:0});
  if(R.boss&&S.bossDead)return;
  R.enemies.forEach(type=>{
    const E=EN[type];let x,y,tries=0;
    do{
      if(type==='boss'){x=LW/2;y=56}
      else{x=(1+Math.floor(Math.random()*14))*TW+8;y=(1+Math.floor(Math.random()*9))*TW+8}
      tries++;
    }while(tries<60&&(!boxFree(x,y,E.w,E.h,E.fly)||Math.hypot(x-S.p.x,y-S.p.y)<56));
    S.enemies.push({type,x,y,hp:E.hp,vx:0,vy:0,t:Math.random()*2,turn:0,hurt:0,kb:null,shoot:1.5+Math.random()*1.5});
  });
  if(R.boss&&!S.bossDead)S.msg={text:'THE BRAMBLE KING',t:2.2};
}

/* ---------- input ---------- */
const held=new Set();let atkPressed=false,lastAct=performance.now(),disguised=false;
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'atk',KeyJ:'atk',KeyZ:'atk',Enter:'atk'};
function activity(){lastAct=performance.now();if(disguised)setCover(false)}
window.addEventListener('keydown',e=>{
  const k=KEYMAP[e.code];if(!k)return;
  if(e.target&&e.target.tagName==='BUTTON'&&(e.code==='Space'||e.code==='Enter')&&state!=='play')return;
  e.preventDefault();
  if(state==='play'){if(!held.has(k)&&k==='atk')atkPressed=true;held.add(k);activity()}
  else if(state==='dead'||state==='win'){if(!e.repeat)continueAfter()}
});
window.addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)held.delete(k)});
function releaseInput(){held.clear();atkPressed=false;if(state==='play')setCover(true)}
window.addEventListener('blur',releaseInput);
document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseInput()});
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture&&b.setPointerCapture(e.pointerId);if(state==='play'){if(k==='atk')atkPressed=true;held.add(k);activity()}else if(state==='dead'||state==='win')continueAfter()});
  const up=()=>held.delete(k);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
});

/* ---------- disguise ---------- */
const cover=$('#cover');const realTitle=document.title;
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function buildCover(){
  if(coverMode==='worksheet'){
    const fr=(n,d)=>'<span class="fr"><span>'+n+'</span><span>'+d+'</span></span>';
    const dens=[[2,3],[3,4],[2,5],[4,6],[3,5],[5,6],[4,8],[3,8],[2,7],[6,8]];
    let li='';
    for(let i=0;i<6;i++){li+='<li><div class="stack"><span>'+rnd(124,968)+'</span><span class="b">× '+rnd(13,79)+'</span></div></li>'}
    for(let i=0;i<4;i++){const d=rnd(3,9),q=rnd(Math.ceil(1000/d),987);li+='<li><span class="flat">'+(d*q).toLocaleString('en-US')+' ÷ '+d+' =</span></li>'}
    for(let i=0;i<5;i++){const[a,b]=dens[rnd(0,dens.length-1)];const op=i%2?'−':'+';const n1=rnd(1,a-1),n2=rnd(1,b-1);li+='<li><span class="flat">'+(op==='−'&&n1/a<n2/b?fr(n2,b)+' '+op+' '+fr(n1,a):fr(n1,a)+' '+op+' '+fr(n2,b))+' =</span></li>'}
    for(let i=0;i<5;i++){const x=(rnd(1200,9800)/100),y=(rnd(150,x*100-50)/100);const sub=i%2===1;li+='<li><div class="stack"><span>'+x.toFixed(2)+'</span><span class="b">'+(sub?'− ':'+ ')+y.toFixed(2)+'</span></div></li>'}
    cover.innerHTML='<div class="ws"><div class="ws-head"><span>Name:</span><span>Date:</span><span style="flex:.5;min-width:90px">Class:</span></div><h2>Grade 5 Math Review</h2><div class="sub">Multiplication, division, fractions, and decimals. Show your work. Simplify fraction answers.</div><ol class="probs">'+li+'</ol><div class="ws-foot"><span>Grade 5 · Unit 4 Review</span><span>Page 1 of 1</span></div></div>';
    document.title='Grade 5 Math Review';
  }else{
    const items=[['Copy paper (case)','Office',14,42.5],['Dry-erase markers (12pk)','Classroom',30,11.99],['HDMI cable 6 ft','Tech',18,7.49],['Chromebook charger','Tech',12,24.95],['Toner cartridge','Office',6,89],['Headphones, wired','Tech',60,6.25],['Laminating pouches','Office',4,18.75],['Composition notebooks','Classroom',120,1.89],['Surge protector','Tech',10,16.4],['Label tape','Office',8,12.3],['USB-C adapter','Tech',15,9.99],['Whiteboard erasers','Classroom',24,2.15],['Stapler','Office',9,8.6],['Batteries AA (24pk)','Classroom',10,14.99],['Ethernet patch cable','Tech',40,3.1],['Folders, 2-pocket','Classroom',200,0.45]];
    let rows='<tr class="h"><th>1</th><td>Item</td><td>Dept</td><td>Qty</td><td>Unit cost</td><td>Total</td><td>Status</td></tr>';let sum=0;
    items.forEach((it,i)=>{const t=it[2]*it[3];sum+=t;rows+='<tr><th>'+(i+2)+'</th><td>'+it[0]+'</td><td>'+it[1]+'</td><td class="n">'+it[2]+'</td><td class="n">$'+it[3].toFixed(2)+'</td><td class="n">$'+t.toFixed(2)+'</td><td>'+(i%4===0?'Ordered':i%3===0?'Pending':'Received')+'</td></tr>'});
    const n=items.length+2;rows+='<tr class="h"><th>'+n+'</th><td>Total</td><td></td><td></td><td></td><td class="n">$'+sum.toFixed(2)+'</td><td></td></tr>';
    for(let i=n+1;i<n+10;i++)rows+='<tr><th>'+i+'</th><td></td><td></td><td></td><td></td><td></td><td></td></tr>';
    cover.innerHTML='<div class="sheet"><div class="sh-top"><b>Q3 Supply Budget</b><div class="sh-menu"><span>File</span><span>Edit</span><span>View</span><span>Insert</span><span>Format</span><span>Data</span><span>Help</span></div></div><div class="sh-fx"><span>F6</span><span>=D6*E6</span></div><div class="sh-grid"><table><thead><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>F</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="sh-tabs"><span>Q3</span><span>Q2</span><span>Vendors</span></div></div>';
    document.title='Q3 Supply Budget';
  }
}
function setCover(on){
  if(on===disguised)return;disguised=on;cover.hidden=!on;
  if(!on)document.title=realTitle;else if(coverMode==='worksheet')document.title='Grade 5 Math Review';else document.title='Q3 Supply Budget';
}
cover.addEventListener('pointerdown',()=>{if(state==='play')activity()});

/* ---------- screens ---------- */
const scr=$('#screen');
function showTitle(){
  state='title';scr.hidden=false;
  const saved=!!store.get('sk-best',null);

      if(!moveEnt(e,e.vx*E.spd*dt,e.vy*E.spd*dt,E.w,E.h))e.turn=0;

  if(!S){// title backdrop
    ctx.fillStyle='#0f1a12';ctx.fillRect(0,0,LW,LH);
    for(let i=0;i<40;i++){const h=hash(i,7);R(ctx,h%LW,(h>>8)%LH,2,2,i%3?'#1f3a24':'#2e6a34')}
    return}
  drawHUD(ctx,t);
  ctx.save();ctx.translate(0,HUD);ctx.beginPath();ctx.rect(0,0,LW,FH);ctx.clip();
  if(S.trans){
    const k=S.trans.t,ox=-S.trans.dx*LW*k,oy=-S.trans.dy*FH*k;
    ctx.drawImage(roomCanvas(S.trans.from),Math.round(ox),Math.round(oy));
    ctx.drawImage(roomCanvas(S.roomKey),Math.round(ox+S.trans.dx*LW),Math.round(oy+S.trans.dy*FH));
    ctx.save();ctx.translate(Math.round(ox+S.trans.dx*LW),Math.round(oy+S.trans.dy*FH));drawPlayer(ctx,S.p,t);ctx.restore();
  }else{
    ctx.drawImage(roomCanvas(S.roomKey),0,0);
    for(const d of S.drops)drawDrop(ctx,d,t);
    for(const e of S.enemies)drawEnemy(ctx,e,t);
    for(const s of S.shots){R(ctx,Math.round(s.x-s.r),Math.round(s.y-s.r),s.r*2,s.r*2,s.dmg>1?'#e05a3a':'#f0d27a');R(ctx,Math.round(s.x-1),Math.round(s.y-1),2,2,'#fff')}
    drawPlayer(ctx,S.p,t);
    for(const f of S.fx){const k=f.t/.35,r=Math.round((1-k)*(f.big?30:10))+2;ctx.fillStyle='rgba(255,255,255,'+k+')';ctx.fillRect(Math.round(f.x-r),Math.round(f.y-1),r*2,2);ctx.fillRect(Math.round(f.x-1),Math.round(f.y-r),2,r*2)}
  }
  if(S.msg){ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,FH/2-14,LW,24);ctx.fillStyle='#f3c74a';ctx.font='8px "Press Start 2P", monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(S.msg.text,LW/2,FH/2-2);ctx.textAlign='left'}
  ctx.restore();
}

/* ---------- loop ---------- */
let last=0;
function frame(ts){
  const now=performance.now(),t=ts/1000;const dt=Math.min(.05,t-(last||t));last=t;
  if(state==='play'&&S){
    if(held.size>0)lastAct=now;
    if(!disguised&&now-lastAct>IDLE)setCover(true);
    if(!disguised)update(dt);
  }
  render(t);
  requestAnimationFrame(frame);
}
updateCoverName();resize();showTitle();requestAnimationFrame(frame);
})();
</script>
