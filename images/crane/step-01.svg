<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Crane step 1: Choose the starting face</title><desc id="desc">Original diagram. Start coloured side up; corner toward you Grey shows paper; blue marks the selected flap, not paper colour. Hidden layers are omitted.</desc><rect width="720" height="480" fill="white"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#1d5788"/></marker></defs><polygon points="180.000,157.000 263.000,240.000 180.000,323.000 97.000,240.000" fill="#f6f7f9" stroke="#253343" stroke-width="1.7" stroke-linejoin="round"/><text x="180" y="355" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#253343">COLOUR UP</text><polygon points="540.000,157.000 623.000,240.000 540.000,323.000 457.000,240.000" fill="#f6f7f9" stroke="#253343" stroke-width="1.7" stroke-linejoin="round"/><text x="540" y="355" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#253343">COLOUR UP</text><text x="180" y="27" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#253343">Before</text><text x="540" y="27" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#253343">After / checkpoint</text><text x="360" y="435" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#253343">Start coloured side up; corner toward you</text><text x="360" y="466" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#253343">SCHEMATIC: hidden layers omitted; physical fold test required</text></svg>