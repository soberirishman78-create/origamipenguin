<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Penguin step 1: Set the starting face</title><desc id="desc">Original vector diagram. Dark face up; diamond orientation Dark is the coloured face and white the reverse. Outside-reverse opening is schematic.</desc><rect width="640" height="420" fill="white"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#2466a0" stroke="white" stroke-width=".7"/></marker></defs><text x="160" y="32" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#263244">Before</text><text x="480" y="32" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#263244">After / checkpoint</text><polygon points="160.000,95.000 280.000,215.000 160.000,335.000 40.000,215.000" fill="#42566a" stroke="#172c42" stroke-width="1.6" stroke-linejoin="round"/><polygon points="480.000,95.000 600.000,215.000 480.000,335.000 360.000,215.000" fill="#42566a" stroke="#172c42" stroke-width="1.6" stroke-linejoin="round"/><text x="320" y="387" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#263244">Dark face up; diamond orientation</text><text x="320" y="411" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#263244">Physical folding and standing are unverified</text></svg>