<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Heart step 2: Make the vertical centre crease</title><desc id="desc">Original mathematical diagram. Left: before; right: after. Pink is the coloured face, white the reverse. Blue dashed lines are folds; arrows show moving corners. Paper thickness is omitted.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#164e8a"/></marker></defs><rect width="640" height="360" fill="white"/><text x="160" y="35" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#18283b">Before</text><polygon points="160.000,80.000 270.000,190.000 160.000,300.000 50.000,190.000" fill="#fff" stroke="#263244" stroke-width="1.6" stroke-linejoin="round"/><text x="480" y="35" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#18283b">After</text><polygon points="480.000,80.000 590.000,190.000 480.000,300.000 370.000,190.000" fill="#fff" stroke="#263244" stroke-width="1.6" stroke-linejoin="round"/><path d="M160.000,80.000 L160.000,300.000" fill="none" stroke="#164e8a" stroke-width="2.4" stroke-dasharray="7 5"/><path d="M50.000,190.000 Q176.500,176.800 270.000,190.000" fill="none" stroke="#164e8a" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M480.000,80.000 L480.000,300.000" stroke="#5c6776" stroke-width="1.8" stroke-dasharray="3 4"/><text x="320" y="337" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#18283b">Fold, then reopen completely</text></svg>